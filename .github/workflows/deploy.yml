name: Deploy to DOKS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 004-todo-ai-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Build and push Backend image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-backend:${{ github.sha }} -f backend/Dockerfile ./backend
          docker tag registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-backend:${{ github.sha }} registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-backend:latest
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-backend:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-backend:latest

      - name: Build and push Frontend image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-frontend:${{ github.sha }} -f frontend/Dockerfile ./frontend
          docker tag registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-frontend:${{ github.sha }} registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-frontend:latest
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-frontend:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-frontend:latest

      - name: Build and push Notification Service image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/notification-service:${{ github.sha }} -f notification-service/Dockerfile ./notification-service
          docker tag registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/notification-service:${{ github.sha }} registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/notification-service:latest
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/notification-service:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/notification-service:latest

      - name: Build and push Recurring Task Service image
        run: |
          docker build -t registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/recurring-task-service:${{ github.sha }} -f recurring-task-service/Dockerfile ./recurring-task-service
          docker tag registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/recurring-task-service:${{ github.sha }} registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/recurring-task-service:latest
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/recurring-task-service:${{ github.sha }}
          docker push registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/recurring-task-service:latest

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DO_CLUSTER_NAME }}

      - name: Deploy to Kubernetes
        run: |
          # Apply Secrets first
          kubectl apply -f k8s/cloud/kafka-secrets.yaml
          kubectl apply -f k8s/cloud/todo-secrets.yaml
          
          # Apply Dapr components
          kubectl apply -f dapr-components/cloud/
          
          # Apply Application manifests (to be created in Phase 4)
          kubectl apply -f k8s/cloud/
          
          # Update images with specific SHA to ensure redeployment
          kubectl set image deployment/todo-backend backend=registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-backend:${{ github.sha }}
          kubectl set image deployment/todo-frontend frontend=registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/todo-frontend:${{ github.sha }}
          kubectl set image deployment/notification-service notification-service=registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/notification-service:${{ github.sha }}
          kubectl set image deployment/recurring-task-service recurring-task-service=registry.digitalocean.com/${{ secrets.DO_REGISTRY_NAME }}/recurring-task-service:${{ github.sha }}

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/todo-backend
          kubectl rollout status deployment/todo-frontend
          kubectl rollout status deployment/notification-service
          kubectl rollout status deployment/recurring-task-service
