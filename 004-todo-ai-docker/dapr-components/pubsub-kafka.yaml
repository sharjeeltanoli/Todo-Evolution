apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    # For Minikube: use the Minikube IP (e.g., 192.168.49.2:9092)
    # For K8s Cluster: use the service DNS (e.g., redpanda.redpanda.svc.cluster.local:9093)
    value: "192.168.49.2:9092"
  - name: authRequired
    value: "false"
  - name: consumerID
    value: "todo-app-group"
  - name: disableTls
    value: "true"
  - name: deadLetterTopic
    value: "dead-letters"