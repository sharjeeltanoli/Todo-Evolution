apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
spec:
  type: LoadBalancer
  selector:
    app: todo-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      imagePullSecrets:
      - name: todo-app-registry-123
      containers:
      - name: todo-frontend
        image: registry.digitalocean.com/todo-app-registry-123/todo-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://todo-backend"
        - name: NEXT_PUBLIC_BACKEND_URL
          value: "http://todo-backend"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10