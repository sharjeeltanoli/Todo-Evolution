apiVersion: v1
kind: Namespace
metadata:
  name: redpanda
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: redpanda
spec:
  ports:
  - name: kafka
    port: 9093
    targetPort: 9092
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redpanda
  namespace: redpanda
subsets:
  - addresses:
      - ip: 172.17.0.2
    ports:
      - name: kafka
        port: 9092
